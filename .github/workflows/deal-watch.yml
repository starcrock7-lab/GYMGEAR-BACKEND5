# Live prices and sales.
#
# Reads the stores and publishes the result to the live-deals branch, which the
# backend polls, so a sale appears or disappears without a merge or a redeploy.
# The daily price-check waited for a human to merge it, and 89 updates piled up
# unmerged from August to November while the site showed months-old sales.
#
# In place of that review: every change is confirmed by a second read, a run
# that reads far fewer products than the last one publishes nothing, and the
# site drops any sale not confirmed in the last 12 hours.
#
# GitHub drops scheduled runs under load: from Nov 9 to 16 2026 only 23 of
# about 60 three-hourly runs started, and gaps of 9 to 12.6 hours were daily,
# right at the 12-hour limit. So the job is scheduled twice an hour and each
# run quits before reading any store if the last feed is under 50 minutes old.
# Stores are still read about once an hour; a 12-hour gap would now need about
# 24 dropped runs in a row.
name: deal-watch

on:
  schedule:
    - cron: '11 * * * *'
    - cron: '41 * * * *'
  # Also started hourly from outside GitHub (cron-job.org, source=timer),
  # because on Nov 17 2026 the schedule above went 8.7 hours without a run.
  workflow_dispatch:
    inputs:
      source:
        description: Leave empty for a manual run
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: deal-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the rules
        run: node scripts/check-live-deals.mjs

      - name: Get the last published feed
        run: |
          git fetch --depth=1 origin live-deals && git show origin/live-deals:live-deals.json > prev.json || echo 'first run'

      # A timed run right after another one has nothing new to read.
      # Manual runs always go ahead.
      - name: Skip if the feed is fresh
        id: age
        if: github.event_name == 'schedule' || inputs.source == 'timer'
        run: |
          node -e "
            const fs = require('fs');
            let at = 0;
            try { at = Date.parse(JSON.parse(fs.readFileSync('prev.json', 'utf8')).generatedAt) || 0; } catch {}
            const min = (Date.now() - at) / 60000;
            console.log('last feed', Math.round(min), 'minutes old');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'skip=' + (min < 50) + '\\n');
          "

      - name: Read the stores
        if: steps.age.outputs.skip != 'true'
        run: |
          set -o pipefail
          node scripts/watch-deals.js --prev prev.json --out live-deals.json | tee watch-log.txt
          { echo '## Deal watch'; echo '```'; cat watch-log.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        if: steps.age.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir publish && cp live-deals.json publish/ && cd publish
          git init -q -b live-deals
          git config user.name "gymgear price bot"
          git config user.email "starcrock7@gmail.com"
          git add live-deals.json
          git commit -q -m "Live deals $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live-deals
