# Daily price and discount truth check.
#
# Daily, not weekly: the site's pitch is the best deals available right now, so
# every row is checked every day for whether its discount is still live — a
# sale that ended yesterday but still shows a struck-through price is a false
# claim. Every product in the catalog is read, so products added by the
# expansion (docs/plans/catalog-expansion.md) are covered from the moment they
# land, with no registration step.
#
# This job NEVER writes to main. It opens a pull request and a human merges it.
# That review is the control that stops a broken extractor silently rewriting
# every price in the catalog.
name: price-check

on:
  schedule:
    - cron: '17 6 * * *' # every day 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write   # the fallback when opening a PR is refused

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Dry run first: the report is the evidence attached to the PR, and it is
      # produced before anything is edited.
      - name: Check listings (dry run)
        id: check
        run: |
          set -o pipefail
          node scripts/check-prices.js --json price-report.json | tee price-log.txt
          echo "changes=$(node -e "const r=require('./price-report.json');console.log(r.results.filter(x=>x.edit).length)")" >> "$GITHUB_OUTPUT"

      # Coverage floor: a catalog we cannot re-read is a catalog whose discounts
      # we cannot vouch for. Growing it with unverifiable rows (Amazon, or any
      # retailer that 403s) would quietly erode this number, so the run fails
      # instead of reporting a clean bill of health on shrinking evidence.
      - name: Check verifiable coverage
        run: |
          node -e "
            const r = require('./price-report.json');
            const total = r.results.length;
            const readable = r.results.filter(x => x.cls !== 'UNREADABLE').length;
            const pct = total ? (readable / total) * 100 : 0;
            const FLOOR = Number(process.env.COVERAGE_FLOOR || 18);
            console.log(\`verifiable coverage: \${readable}/\${total} (\${pct.toFixed(1)}%), floor \${FLOOR}%\`);
            if (pct < FLOOR) {
              console.error('FAILED: coverage below the floor — new rows must come from feeds we can re-read.');
              process.exit(1);
            }
          "
        env:
          COVERAGE_FLOOR: '18'

      # Visible even when nothing changes, so a run that read 0 products is
      # obvious instead of looking like a clean bill of health.
      - name: Publish summary
        if: always()
        run: |
          {
            echo '## Price check'
            echo '```'
            tail -n 40 price-log.txt || echo 'no output — the run failed before reporting'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply changes and open PR
        if: steps.check.outputs.changes != '0'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          node scripts/check-prices.js --write --json price-report.json
          node --check server.js   # a bad edit must never reach a PR

          BRANCH="price-check/$(date -u +%Y-%m-%d)"
          git config user.name  "gymgear price bot"
          git config user.email "starcrock7@gmail.com"
          git checkout -b "$BRANCH"
          git add server.js
          git commit -m "chore: price check $(date -u +%Y-%m-%d)" -m "Prices read from the live listings. Every changed value is evidenced in the run log; review before merging."
          git push -u origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          node scripts/pr-body.js price-report.json > pr-body.md

          # Opening the PR can be refused even though the push succeeded: the
          # repo setting "Allow GitHub Actions to create and approve pull
          # requests" gates it. That is exactly what happened on 2026-08-03 and
          # 2026-08-08 — both runs pushed a branch carrying real price changes,
          # the PR step failed, and nobody was told. Deals sat unmerged for days.
          # So a refused PR must not kill the run silently; it falls through to
          # the issue below.
          if gh pr create             --title "Price check $(date -u +%Y-%m-%d)"             --body-file pr-body.md             --base main --head "$BRANCH"; then
            echo "opened=yes" >> "$GITHUB_OUTPUT"
          else
            echo "opened=no" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not open a PR — branch $BRANCH is pushed and waiting. Enable Settings > Actions > General > Workflow permissions > 'Allow GitHub Actions to create and approve pull requests'."
          fi

      # A change nobody can see is a change that does not happen. If the PR was
      # refused, say so somewhere a human actually looks.
      - name: Raise an issue when the PR was refused
        if: steps.pr.outputs.opened == 'no'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "The daily price check found changes and pushed them to \`${{ steps.pr.outputs.branch }}\`, but it could not open a pull request."
            echo
            echo "**Fix once:** Settings → Actions → General → Workflow permissions → tick *Allow GitHub Actions to create and approve pull requests*."
            echo
            echo "**Merge meanwhile:** \`git fetch origin && git cherry-pick -x origin/${{ steps.pr.outputs.branch }}\`"
            echo
            echo '```'
            tail -n 30 price-log.txt
            echo '```'
          } > issue.md
          gh issue create --title "Price check $(date -u +%Y-%m-%d) is stranded on a branch" --body-file issue.md

      # The report is an artifact, not a commit: it carries URLs and timestamps
      # that would otherwise churn the repo every week.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-report
          path: |
            price-report.json
            price-log.txt
